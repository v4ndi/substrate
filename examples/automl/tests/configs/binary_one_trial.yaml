env_type: local
backend: boosting
engine: catboost
device: gpu
target_column: target
client_id_column: epk_id
report_month_column: report_month
group_column: group
treatment_column: treatment
inverse_treatment: true
model_scope: product
categorical_columns: ${oc.env:SBER_INFRA_ROOT}/fmlib-main/examples/automl/tests/configs/features/categorical_columns.yaml
numerical_columns: ${oc.env:SBER_INFRA_ROOT}/fmlib-main/examples/automl/tests/configs/features/numerical_columns.yaml
hidden_state_columns: [seq_hidden_state]
hyperopt: true
optimization_metric: roc_auc
n_trials: 1
random_state: 42
verbose: false
search_space:
  iterations: [16]
  depth: [2]
  l2_leaf_reg: [1.0]
  bagging_temperature: [0.25]
  learning_rate: [0.1]
output_dir: ${oc.env:SBER_INFRA_ROOT}/outputs/notebook_tests/config_yaml

environment: {}

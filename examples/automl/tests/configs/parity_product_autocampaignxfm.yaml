product: binary_parity_product
task_type: binary_clf
data:
  input_dir:
    train: ${oc.env:SBER_INFRA_ROOT}/data/binary/train
    valid: ${oc.env:SBER_INFRA_ROOT}/data/binary/valid
    test: ${oc.env:SBER_INFRA_ROOT}/data/binary/test
  drop_columns_product: [epk_id, target, treatment, report_month]
  inverse_treatment: true
  unsqueeze_features: false
  data_date_range: {min: "${date: 2023-01-01}", max: "${date: 2025-01-01}"}
  train_date_range: {min: "${date: 2023-01-01}", max: "${date: 2024-07-01}"}
  val_date_range: {min: "${date: 2024-07-01}", max: "${date: 2024-10-01}"}
  test_date_range: {min: "${date: 2024-10-01}", max: "${date: 2025-01-01}"}
  target_column: target
  report_month_column: report_month
  group_column: group
  treatment_control_group_column: treatment
  hidden_state_columns: [seq_hidden_state]
  select_features: false
model: {boosting_type: catboost}
optuna_ranges:
  catboost:
    iterations: {low: 12, high: 12, step: 1}
    depth: {low: 2, high: 2}
    l2_leaf_reg: {low: 1.0, high: 1.0}
    bagging_temperature: {low: 0.25, high: 0.25}
    learning_rate: {low: 0.1, high: 0.1}
feature_selection:
  timeout: 18000
  cpu_limit: 8
  memory_limit: 120
  reader_params: {n_jobs: 8, cv: 5, random_state: 42}
  selection_params:
    mode: 2
    feature_group_size: 1
    max_features_cnt_in_result: 100
    select_algos: [linear_l2, gbm]
train:
  output_dir: ${oc.env:SBER_INFRA_ROOT}/outputs/notebook_tests/parity_product/autocampaignxfm
  use_regression: false
  use_p_model: false
  optimization_type: rocauc
  trials: 3
  random_state: 42
evaluate:
  model_configs_dir: ${train.output_dir}/configs_product/
  output_dir: ${oc.env:SBER_INFRA_ROOT}/outputs/notebook_tests/parity_product/autocampaignxfm_evaluate
  use_p_model: false
  is_product: true
  campaign_scores_path: null
  calib_months: ["2024-07-01", "2024-08-01", "2024-09-01"]
  oot_months: ["2024-10-01", "2024-11-01", "2024-12-01"]

task:
  env_type: local
  backend: boosting
  engine: xgboost
  device: cpu
  model_scope: product
data:
  target_column: target
  client_id_column: epk_id
  report_month_column: report_month
  group_column: group
  treatment_column: treatment
  categorical_columns: [cat_feature_1, cat_feature_2, cat_feature_3, cat_feature_4, cat_feature_5]
  numerical_columns: [num_feature_1, num_feature_2, num_feature_3, num_feature_4, num_feature_5]
  hidden_state_columns: []
  inverse_treatment: true
train:
  estimate_propensity: false
  hyperopt: true
  optimization_metric: qini_auc
  n_trials: 1
  verbose: false
  search_space:
    n_estimators: [6]
    max_depth: [2]
output_dir: ${oc.env:SBER_INFRA_ROOT}/outputs/notebook_tests/uplift/config_inline

environment: {}

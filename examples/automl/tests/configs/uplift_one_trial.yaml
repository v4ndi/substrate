task:
  env_type: local
  backend: boosting
  engine: xgboost
  device: cpu
  model_scope: product
data:
  target_column: target
  client_id_column: epk_id
  report_month_column: report_month
  group_column: group
  treatment_column: treatment
  categorical_columns: ${oc.env:SBER_INFRA_ROOT}/fmlib-main/examples/automl/tests/configs/features/categorical_columns.yaml
  numerical_columns: ${oc.env:SBER_INFRA_ROOT}/fmlib-main/examples/automl/tests/configs/features/numerical_columns.yaml
  hidden_state_columns: []
  inverse_treatment: true
train:
  estimate_propensity: true
  hyperopt: true
  optimization_metric: qini_auc
  n_trials: 1
  verbose: false
  search_space:
    n_estimators: [6]
    max_depth: [2]
output_dir: ${oc.env:SBER_INFRA_ROOT}/outputs/notebook_tests/uplift/config_yaml

environment: {}

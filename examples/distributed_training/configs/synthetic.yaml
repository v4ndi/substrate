# Обучение на синтетических данных, один или несколько процессов.
# Путь к данным передаётся при запуске: data_dir=/абсолютный/путь
data_dir: ???

distributed:
  backend: null              # null -> nccl на GPU, gloo иначе
  gradient_accumulation_steps: 1
amp: no                      # no | fp16 | bf16
ddp:
  find_unused_parameters: False

train_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: avatar.data.TabularDataset
    path: ${data_dir}/train
    shuffle_files: True
    shuffle_pq: True
    filter_cache: False      # 40k строк сканируются мгновенно, кэш только мешает
  batch_size: 512
  num_workers: 2
  drop_last: False
  pin_memory: False
  collate_fn:
    _target_: avatar.data.TabularCollateFn
    target_column: target

valid_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: avatar.data.TabularDataset
    path: ${data_dir}/valid
    shuffle_files: False     # валидация должна быть воспроизводимой
    shuffle_pq: False
    filter_cache: False
  batch_size: 512
  num_workers: 2
  drop_last: False
  pin_memory: False
  collate_fn:
    _target_: avatar.data.TabularCollateFn
    target_column: target

model:
  _target_: avatar.pipeline.tabular.TabularClassification
  tabular_model:
    _target_: avatar.pipeline.tabular.TabularWithAggregatedStates
    embedding:
      _target_: avatar.nn.embedding.TabularEmbedding
      num_numerical_features: 16     # столько же, сколько пишет generate_data.py
      vocab_size: 64
      hidden_size: 32
    encoder:
      _target_: avatar.nn.tabular.TabularTransformer
      hidden_size: ${model.tabular_model.embedding.hidden_size}
      num_heads: 4
      num_layers: 2
      attn_dropout: 0.1
    aggregation_config:
      name: linear
      num_features: 24               # 8 категориальных + 16 числовых
      emb_dim: ${model.tabular_model.embedding.hidden_size}
  num_classes: 2
  dropout_p: 0.1
  task_type: classification

optimizer:
  _target_: torch.optim.AdamW
  _partial_: True
  lr: 0.002
  weight_decay: 0.01

scheduler:
  _target_: transformers.optimization.get_scheduler
  _partial_: True
  name: cosine
  num_warmup_steps: 20
  num_training_steps: 2000

train:
  start_epoch: 0
  checkpoint_state: null
  model_state: null
  seed: 42
  num_epochs: 3
  clip_grad_norm: 1.0
  max_saved_checkpoints: 2

mlflow:
  experiment_name: distributed_training_example
  run_name: debug            # "debug" разрешает перезапуск в тот же каталог

metrics:
  valid_metrics:
    _target_: avatar.metrics.RocAucScore

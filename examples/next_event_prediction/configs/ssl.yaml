accelerator:
  _target_: accelerate.Accelerator
  _partial_: True
  dataloader_config:
    _target_: accelerate.utils.DataLoaderConfiguration
    dispatch_batches: False
  kwargs_handlers:
    - _target_: accelerate.utils.DistributedDataParallelKwargs
      find_unused_parameters: True
  gradient_accumulation_steps: 2
train_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: avatar.data.EventSequenceDataset
    path: data/processed_sequences/train
    min_length: 1
    max_length: 128
    random_slicing: True
    event_time_column: "evt_dttm"
    event_ids_column: "event_ids"
    sequence_columns: ["evt_attr_9", "evt_attr_15", "channel_group", "sale_product_class_id"]
    read_columns: null
    selected_event_ids: null
    shuffle_files: True
    shuffle_pq: True
  batch_size: 512
  pin_memory: True
  drop_last: False
  num_workers: 8
  collate_fn:
    _target_: avatar.data.EventSequenceCollateFn
    sequence_columns: ${train_dataloader.dataset.sequence_columns}
    create_attention_mask: True
valid_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: avatar.data.EventSequenceDataset
    path: data/processed_sequences/valid
    min_length: 1
    max_length: 128
    random_slicing: True
    event_time_column: "evt_dttm"
    event_ids_column: "event_ids"
    sequence_columns: ${train_dataloader.dataset.sequence_columns}
    read_columns: null
    selected_event_ids: null
    shuffle_files: True
    shuffle_pq: True
  batch_size: 512
  pin_memory: True
  drop_last: False
  num_workers: 8
  collate_fn:
    _target_: avatar.data.EventSequenceCollateFn
    sequence_columns: ${train_dataloader.dataset.sequence_columns}
    create_attention_mask: True
model:
  _target_: avatar.pipeline.sequence.NextKTokensPrediction
  model:
    _target_: avatar.nn.sequential.TransformersWrapper
    event_encoder:
      _target_: avatar.nn.sequential.EventEncoder
      dropout_p: 0.1
      time_encoding: delta
      embedding:
        _target_: avatar.nn.embedding.EventSequenceEmbedding
        hidden_size: 128
        columns_meta:
          evt_attr_9:
            type: categorical
            n_classes: 524
            event_id: 0
          evt_attr_15:
            type: numeric
            n_classes: 1
            event_id: 0
          channel_group:
            type: categorical
            n_classes: 10
            event_id: 2
          sale_product_class_id:
            type: categorical
            n_classes: 39
            event_id: 2
    backbone:
      _target_: transformers.GPT2Model
      config:
        _target_: transformers.GPT2Config
        n_positions: 128
        vocab_size: 0 # может быть любое значение, так как nn.Embedding gpt мы не используем
        n_embd: ${model.model.event_encoder.embedding.hidden_size}
        n_layer: 2
        n_head: 2
        pad_token_id: 0
        bos_token_id: 1
        eos_token_id: 2
mlflow:
  experiment_name: next_event_prediction
  run_name: self_supervised
  logging_dir: ./mlruns
optimizer:
  _target_: torch.optim.AdamW
  _partial_: True
  lr: 0.001
  weight_decay: 0.01
  scale_lr_multigpu: False
scheduler:
  _target_: transformers.optimization.get_scheduler
  _partial_: True
  name: cosine
  num_warmup_steps: 300
  num_training_steps: 1_000_000
train:
  start_epoch: 0
  checkpoint_state: null
  model_state: null
  seed: 42
  num_epochs: 20
  clip_grad_norm: 1.5
  max_saved_checkpoints: 20
  device_specific: False
  early_stopping:
    _target_: avatar.train_utils.EarlyStopping
    main_metric: loss
    patience: 10
    delta: 0
    strategy: min
metrics:
  valid_metrics:
    _target_: avatar.metrics.MultiLossMetric
# Inference for uplift.yaml: the same model, the same data layout, weights
# from the training run, and a metric whose product is a file rather than a
# number. Run from the repository root:
#
#     python -m fmlib.inference --config-dir=examples/tabular_tasks/configs \
#         --config-name=uplift_inference
#
load_state: best_models/tabular_tasks/uplift_smoke/64/model.bin
distributed:
  backend: null # null -> nccl on GPU, gloo on CPU
  gradient_accumulation_steps: 1
amp: no
ddp:
  find_unused_parameters: False

test_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: fmlib.data.TabularDataset
    drop_tail: false # inference keeps the tail
    path: examples/tabular_tasks/data/uplift_smoke/valid
    shuffle_files: False
    shuffle_pq: False
  batch_size: 1024
  pin_memory: True
  drop_last: False
  num_workers: 2
  collate_fn:
    _target_: fmlib.data.UpliftCollateFn
    target_column: target
    treatment_column: treatment
    group_column: group
    inverse_treatment: True

model:
  _target_: fmlib.pipeline.tabular.SLearner
  embedding:
    _target_: fmlib.nn.embedding.TabularEmbedding
    num_numerical_features: 2
    hidden_size: 64
    vocab_size: 26
  tabular_encoder:
    _target_: fmlib.nn.tabular.TabularTransformer
    hidden_size: ${model.embedding.hidden_size}
    num_heads: 4
    num_layers: 2
    attn_dropout: 0.15
  aggregation_config:
    name: linear
    num_features: 10 # 8 features + the treatment token + the group token
    emb_dim: ${model.embedding.hidden_size}
  n_groups: 4 # 3 channels, plus the id reserved for control
  exchange_treatment_group: true
  hidden_state_dim: null

metrics:
  test_metrics:
    _target_: fmlib.metrics.UpliftMetrics
    require_calibration: True
    # The product here is both: the numbers, and a per-record parquet.
    save_submit_path: predict/uplift

distributed:
  backend: null  # null -> nccl on GPU, gloo on CPU
  gradient_accumulation_steps: 1
amp: no  # no | fp16 | bf16
ddp:
  find_unused_parameters: False
test_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: avatar.data.EventSequenceDataset
    path: /home/datalab/projects/avatar/avatards/rusakov/8m_chains_2026_02_01_test_amazme_v2
    max_length: 1024
    event_time_column: evt_dttm
    event_ids_column: event_ids
    sequence_columns: ['txn_evt_attr_9', 'txn_evt_attr_4', 'txn_evt_attr_5', 'txn_evt_attr_1', 'txn_evt_attr_2', 'txn_evt_attr_3', 'evk_vnv_evt_attr_1', 'evk_vnv_channel_group', 'evk_vnv_sale_product_class_id', 'evk_vnv_sale_type_id', 'pos_geo_evt_attr_1', 'txn_evt_attr_15', 'holidays_evt_attr_1']
    read_columns: ['epk_id', 'event_ids', 'evt_dttm', 'txn_evt_attr_9', 'txn_evt_attr_4', 'txn_evt_attr_5', 'txn_evt_attr_1', 'txn_evt_attr_2', 'txn_evt_attr_3', 'evk_vnv_evt_attr_1', 'evk_vnv_channel_group', 'evk_vnv_sale_product_class_id', 'evk_vnv_sale_type_id', 'pos_geo_evt_attr_1', 'txn_evt_attr_15', 'holidays_evt_attr_1']
    selected_event_ids: null
    shuffle_files: false
    shuffle_pq: false
  batch_size: 256
  pin_memory: true
  drop_last: false
  num_workers: 8
  collate_fn:
    _target_: avatar.data.EventSequenceCollateFn
    sequence_columns: ${test_dataloader.dataset.sequence_columns}
    create_attention_mask: true
model:
  _target_: avatar.pipeline.sequence.SequenceModelWithAggregation
  model_weights: /home/datalab/nfs/avatar_main/avatar_fm/experiments/sbercampaign_pilot/pilot_seq_model.bin
  freeze_backbone: true
  aggregation_config:
    name: sum
  sequence_model:
    _target_: avatar.nn.sequential.TransformersWrapper
    event_encoder:
      _target_: avatar.nn.sequential.EventEncoder
      dropout_p: 0.1
      time_encoding: delta
      embedding:
        _target_: avatar.nn.embedding.EventSequenceEmbedding
        hidden_size: 256
        columns_meta:
          evk_vnv_channel_group:
            n_classes: 10
            type: categorical
            event_id: 2
          evk_vnv_evt_attr_1:
            n_classes: 3
            type: categorical
            event_id: 2
          evk_vnv_sale_product_class_id:
            n_classes: 38
            type: categorical
            event_id: 2
          evk_vnv_sale_type_id:
            n_classes: 22
            type: categorical
            event_id: 2
          holidays_evt_attr_1:
            n_classes: 87
            type: categorical
            event_id: null
          pos_geo_evt_attr_1:
            n_classes: 87
            type: categorical
            event_id: null
          txn_evt_attr_4:
            n_classes: 3
            type: categorical
            event_id: [0, 1]
          txn_evt_attr_5:
            n_classes: 3
            type: categorical
            event_id: [0, 1]
          txn_evt_attr_15:
            n_classes: 1
            type: numeric
            event_id: [0, 1]
          txn_evt_attr_9:
            n_classes: 684
            type: categorical
            event_id: [0, 1]
          txn_evt_attr_1:
            n_classes: 429
            type: categorical
            event_id: 1
          txn_evt_attr_2:
            n_classes: 4
            type: categorical
            event_id: 1
          txn_evt_attr_3:
            n_classes: 44
            type: categorical
            event_id: 1
    backbone:
      _target_: transformers.GPT2Model
      config:
        _target_: transformers.GPT2Config
        n_positions: 1024
        vocab_size: 0
        n_embd: ${model.sequence_model.event_encoder.embedding.hidden_size}
        n_layer: 8
        n_head: 4
        pad_token_id: 0
        bos_token_id: 1
        eos_token_id: 2
metrics:
  test_metrics:
    _target_: avatar.metrics.CollectEmbeddings
    path_to_save: /home/datalab/projects/avatar/avatards/rusakov/test_embds_v2
    save_steps: 1200
    prefix: null

load_state: /home/datalab/nfs/best_models/february-pilot/${product}_cs/73750/model.bin  #####
accelerator:
  _target_: accelerate.Accelerator
  _partial_: True
  dataloader_config:
    _target_: accelerate.utils.DataLoaderConfiguration
    dispatch_batches: False
  dynamo_plugin:
    _target_: accelerate.utils.TorchDynamoPlugin
    backend: "inductor"
product: sa
test_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: avatar.data.dataset.TabularDataset
    path: /home/datalab/projects/avatards/avatar/rusakov/pilot_cs_full_table/split_type=test  ##
    shuffle_files: False
    shuffle_pq: False
    hidden_state_columns:
      - seq_hidden_state # название колонки с hidden_state
      - sbol_hidden_state
  batch_size: 2048
  pin_memory: True
  drop_last: False
  num_workers: 8
  collate_fn:
    _target_: avatar.data.dataset.collate_fn.TabularCollateFn
model:
  _target_: avatar.pipeline.uplift.SLearner
  embedding:
    _target_: avatar.nn.embedding.TabularEmbedding
    num_numerical_features: 261
    hidden_size: 64
    vocab_size: 415
    std_noise: 0.02
  tabular_encoder:
    _target_: avatar.nn.tabular.TabularTransformer
    hidden_size: ${model.embedding.hidden_size}
    num_heads: 4
    num_layers: 3
    attn_dropout: 0.15
  exchange_treatment_group: false
  aggregation_config:
    name: linear
    num_features: 314
    emb_dim: ${model.embedding.hidden_size}
  # hidden_state_dim: 256
  proj_hiddens_to_dim: 128
  normalize_hidden_states:
    seq_hidden_state: 256
    sbol_hidden_state: 128
  n_groups: 6

metrics:
  test_metrics:
    _target_: avatar.metrics.campaign.InferenceMultiTaskCampaignMetrics
    path_to_save: /home/datalab/nfs/february-pilot/cs/prom_scores/${product}  ###
    save_steps: 1000
    prefix: "first"
campaign_meta:
  tasks:
    sa_response:
      comm_type:
        - 0
        - 1
        - 2
        - 3

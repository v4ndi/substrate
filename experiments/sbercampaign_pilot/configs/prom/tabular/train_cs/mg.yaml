distributed:
  backend: null  # null -> nccl on GPU, gloo on CPU
  gradient_accumulation_steps: 1
amp: no  # no | fp16 | bf16
ddp:
  find_unused_parameters: True
product: mg
train_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: avatar.data.TabularDataset
    path: /home/datalab/projects/avatards/avatar/rusakov/february_tabular/split_type=train/product_name=${product}_response
    shuffle_files: True
    shuffle_pq: True
    hidden_state_columns:
      - seq_hidden_state # название колонки с hidden_state
      - sbol_hidden_state
  batch_size: 2048
  pin_memory: True
  drop_last: False
  num_workers: 8
  collate_fn:
    _target_: avatar.data.UpliftCollateFn
    target_column: target_attr_1 # назване колонки факта конверсии
    treatment_column: target_attr_3 # название колонки флага контролько целевой группы (1 - ЦГ, 0 - КГ)
    inverse_treatment: True # если True то в treatment_column 0 заменяется на 1  и наоборот (В данном наборе данных 1 - КГ, 0 - ЦГ, поэтому необходимо сделать 1 - treatment_column)
    group_column: target_attr_2
valid_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset:
    _target_: avatar.data.TabularDataset
    path: /home/datalab/projects/avatards/avatar/rusakov/february_tabular/split_type=calib/product_name=${product}_response
    shuffle_files: False
    shuffle_pq: False
    hidden_state_columns:
      - seq_hidden_state # название колонки с hidden_state
      - sbol_hidden_state
  batch_size: 2048
  pin_memory: True
  drop_last: False
  num_workers: 8
  collate_fn:
    _target_: avatar.data.UpliftCollateFn
    target_column: target_attr_1 # назване колонки факта конверсии
    treatment_column: target_attr_3 # название колонки флага контролько целевой группы (1 - ЦГ, 0 - КГ)
    inverse_treatment: True # если True то в treatment_column 0 заменяется на 1  и наоборот (В данном наборе данных 1 - КГ, 0 - ЦГ, поэтому необходимо сделать 1 - treatment_column)
    group_column: target_attr_2
model:
  _target_: avatar.pipeline.uplift.SLearner
  embedding:
    _target_: avatar.nn.embedding.TabularEmbedding
    num_numerical_features: 261
    hidden_size: 64
    vocab_size: 415
    std_noise: 0.02
  tabular_encoder:
    _target_: avatar.nn.tabular.TabularTransformer
    hidden_size: ${model.embedding.hidden_size}
    num_heads: 2
    num_layers: 1
    attn_dropout: 0.15
  exchange_treatment_group: false
  aggregation_config:
    name: linear
    num_features: 314
    emb_dim: ${model.embedding.hidden_size}
  # hidden_state_dim: 256
  proj_hiddens_to_dim: 128
  normalize_hidden_states:
    seq_hidden_state: 256
    sbol_hidden_state: 128
  n_groups: 6
mlflow:
  experiment_name: february-pilot
  run_name: ${product}_cs
  logging_dir: ./mlruns
optimizer:
  _target_: torch.optim.AdamW
  _partial_: True
  lr: 0.001
  weight_decay: 0.01
  scale_lr_multigpu: True
scheduler:
  _target_: transformers.optimization.get_scheduler
  _partial_: True
  name: cosine
  num_warmup_steps: 1000
  num_training_steps: -1
train:
  start_epoch: 0
  checkpoint_state: null
  model_state: null
  seed: 45
  num_epochs: 30
  clip_grad_norm: null
  max_saved_checkpoints: 200
  device_specific: false
  early_stopping: null
  steps_before_evaluation: 200
metrics:
  valid_metrics:
    _target_: avatar.metrics.utils.GroupAverageMetricWrapper
    metric:
      _target_: avatar.metrics.utils.GroupAverageMetricWrapper
      metric:
        _target_: avatar.metrics.uplift.UpliftMetrics
        require_calibration: true
      groups: null
      avg_over_regulars:
        avg_calib_uplift_at_20: ^calib_group_\d+_uplift_at_20$
        avg_test_calibrated_uplift_at_20: ^test_group_\d+_calibrated_uplift_at_20$

        avg_calib_qini_auc_score: ^calib_group_\d+_qini_auc_score$
        avg_test_calibrated_qini_auc_score: ^cc_test_group_\d+_calibrated_qini_auc_score$

        avg_calib_treatment_roc_auc_score: ^calib_group_\d+_treatment_roc_auc_score$
        avg_test_treatment_roc_auc_score: ^test_group_\d+_treatment_roc_auc_score$

        avg_calib_control_roc_auc_score: ^calib_group_\d+_control_roc_auc_score$
        avg_test_control_roc_auc_score: ^test_group_\d+_control_roc_auc_score$

    avg_over_regulars:
      avg_calib_roc_auc_score: ^avg_calib_[^_]+_roc_auc_score$
      avg_test_roc_auc_score: ^avg_test_[^_]+_roc_auc_score$
# What makes a multiclass task different from the others. Everything else about
# the run is the same and is generated by assembly.py.
#
# `num_classes: null` is not a default: it is a required override. The number of
# classes is a property of the data, and the task already carries it through the
# existing `_backend_options()` hook.
score_transform: softmax
is_regression: false
model:
  num_classes: null
  task_type: classification
